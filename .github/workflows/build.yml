name: Build installers

# Runs on every push to main and on demand (Actions tab -> "Build installers" -> Run workflow).
# Produces: Windows .exe installer, macOS .dmg (Apple Silicon and Intel).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      llama_tag:
        description: "llama.cpp release tag (empty = latest)"
        required: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            llama_variant: win-vulkan-x64
            bundles: nsis
          - name: macos-arm64
            os: macos-latest
            llama_variant: macos-arm64
            bundles: dmg
          - name: macos-x64
            os: macos-15-intel
            llama_variant: macos-x64
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm install

      - name: Download llama.cpp (llama-server)
        run: npm run fetch-llama
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLAMA_VARIANT: ${{ matrix.llama_variant }}
          LLAMA_TAG: ${{ inputs.llama_tag }}

      - name: App icons
        run: npx tauri icon app-icon.png

      - name: Build app
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Unit tests
        run: cargo test --release --manifest-path src-tauri/Cargo.toml

      - uses: actions/upload-artifact@v4
        with:
          name: MA-Tarjimon-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
